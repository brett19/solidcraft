# Fork-only (brett19/solidcraft): unofficial, unsigned test builds of the solidcore branch, with
# the pure-Rust solidcore kernel only (no C++ SMLib: no smlib feature, no scripts/fetch-smlib.sh).
# Every package release.yml builds, published as a GitHub pre-release tagged solidcore-<sha>.
# The fork-builds branch follows solidcore by merges; it never goes upstream.
name: Fork builds (solidcore only)

on:
  push:
    branches: [fork-builds]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    if: github.repository == 'brett19/solidcraft'
    uses: ./.github/workflows/release.yml
    # No secrets: nothing is signed. The release job's contents: write must be granted although
    # packages_only skips it (as in release-gate.yml); actions: read is the Windows job's.
    permissions:
      contents: write
      actions: read
    with:
      draft: false
      packages_only: true
      solidcore_only: true

  publish:
    name: Publish the pre-release
    needs: packages
    # Publish what built, even when a platform failed; the notes list what is missing.
    if: ${{ !cancelled() && github.repository == 'brett19/solidcraft' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PACKAGES_RESULT: ${{ needs.packages.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Notes and checksums
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::9}"
          git fetch --quiet origin solidcore || true
          if git rev-parse --verify --quiet origin/solidcore >/dev/null; then
            base="$(git merge-base HEAD origin/solidcore)"
          else
            base=unknown
          fi
          pin="$(sed -n 's/^solidcore = { git = "\([^"]*\)", rev = "\([0-9a-f]*\)" }.*/\1 @ \2/p' Cargo.toml)"
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no packages were built"; exit 1; fi
          (cd artifacts && sha256sum -- * >SHA256SUMS.txt)
          missing=()
          for want in linux-x86_64.AppImage linux-aarch64.AppImage linux-x86_64.deb linux-aarch64.deb \
            linux-x86_64.rpm linux-aarch64.rpm linux-x86_64.tar.gz linux-aarch64.tar.gz \
            linux-x86_64.flatpak linux-aarch64.flatpak linux-x86_64.snap linux-aarch64.snap \
            linux-x86_64.pkg.tar.zst linux-aarch64.pkg.tar.zst freebsd-x86_64.tar.gz \
            macos-universal.dmg windows-x64.msi windows-x86.msi windows-arm64.msi; do
            ls artifacts/*"-$want" >/dev/null 2>&1 || missing+=("$want")
          done
          ls artifacts/solidcraft-web-*.zip >/dev/null 2>&1 || missing+=("web zip")
          {
            echo "**Unofficial, unsigned test build of the \`solidcore\` branch with the solidcore kernel only.**"
            echo
            echo "- Built from \`fork-builds\` at $GITHUB_SHA, which is \`solidcore\` at \`$base\` plus the fork-only build workflow."
            echo "- solidcore pin: \`$pin\`"
            echo "- The C++ SMLib kernel is not included: no \`smlib\` feature, nothing from \`scripts/fetch-smlib.sh\`. Choosing the SMLib kernel option (or \`SOLIDCRAFT_KERNEL=smlib\`) makes every operation answer \"not supported yet: this build has no SMLib\"."
            echo "- Nothing is signed: Windows SmartScreen and macOS Gatekeeper will warn (on macOS, right-click > Open, or \`xattr -dr com.apple.quarantine\`)."
            echo "- Not a SolidCraft release; tangency-labs/solidcraft does not publish or support it."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (packages: $PACKAGES_RESULT)"
            if [ "${#missing[@]}" -gt 0 ]; then
              echo
              echo "Missing from this build (failed): ${missing[*]}"
            fi
          } >notes.md
          cat notes.md
          echo "TAG=solidcore-$short" >>"$GITHUB_ENV"
          echo "TITLE=solidcore test build $short (unofficial, unsigned, solidcore kernel only)" >>"$GITHUB_ENV"
      - name: Publish
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check --quiet SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of the same commit: refresh its files and notes.
            gh release upload "$TAG" --clobber -- *
            gh release edit "$TAG" --prerelease --latest=false --title "$TITLE" --notes-file ../notes.md
          else
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file ../notes.md -- *
          fi
          echo "### Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >>"$GITHUB_STEP_SUMMARY"
